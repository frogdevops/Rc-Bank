[package]
name = "bank_api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
bank_db = { path = "../bank_db" }
bank_domain = { path = "../bank_domain" }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
oracledb = { git = "https://github.com/frogdevops/rust-oracledb.git", branch = "#12-named-column-lookup" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
